<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
  <title id="title">用户抢红包分支流程</title><desc id="desc">用户资格校验通过后领取红包，不通过时返回失败并在结束前汇聚。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="700" fill="#F5F7FB"/><text x="48" y="58" font-size="28" font-weight="700" fill="#172033">用户抢红包分支流程</text><text x="48" y="84" font-size="13" fill="#64748B">判断出口在同一层展开，分支使用独立通道并在结束前汇聚</text>
  <rect x="48" y="120" width="1104" height="510" rx="18" fill="#FFFFFF" stroke="#D7E0EA"/>
  <rect x="1030" y="34" width="122" height="30" rx="15" fill="#FFFFFF" stroke="#D7E0EA"/><text x="1091" y="54" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">CLEAN</text>
  <g fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#arrow)"><line id="branch-edge-1" data-role="edge" x1="200" y1="250" x2="270" y2="250"/><line id="branch-edge-2" data-role="edge" x1="440" y1="250" x2="508" y2="250"/><path d="M592 250H680"/><path d="M550 292V440H680"/><path d="M850 250H940V352"/><path d="M850 440H940V368"/><line x1="940" y1="368" x2="940" y2="480"/></g>
  <rect id="flow-start" data-role="node" x="82" y="216" width="118" height="68" rx="34" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <rect id="branch-submit" data-role="node" x="270" y="202" width="170" height="96" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <polygon id="branch-decision" data-role="node" points="550,202 608,250 550,298 492,250" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
  <rect id="branch-pass" data-role="node" x="680" y="202" width="170" height="96" rx="14" fill="#ECFDF5" stroke="#86EFAC"/>
  <rect id="branch-revise" data-role="node" x="680" y="392" width="170" height="96" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="940" cy="360" r="9" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect id="flow-end" data-role="node" x="881" y="480" width="118" height="68" rx="34" fill="#ECFDF5" stroke="#4ADE80" stroke-width="2"/>
  <g text-anchor="middle"><text x="141" y="256" font-size="14" font-weight="600" fill="#1D4ED8">开始</text><text x="355" y="242" font-size="15" font-weight="600" fill="#172033">发起抢红包</text><text x="355" y="270" font-size="12" fill="#64748B">提交活动与用户信息</text><text x="550" y="255" font-size="13" font-weight="600" fill="#172033">资格有效？</text><text x="765" y="242" font-size="15" font-weight="600" fill="#166534">领取红包</text><text x="765" y="270" font-size="12" fill="#64748B">原子扣减并记录领取</text><text x="765" y="432" font-size="15" font-weight="600" fill="#B91C1C">返回失败</text><text x="765" y="460" font-size="12" fill="#64748B">提示无资格或已领完</text><text x="940" y="520" font-size="14" font-weight="600" fill="#15803D">结束</text></g>
  <text x="636" y="238" font-size="12" fill="#15803D">是</text><text x="566" y="374" font-size="12" fill="#B91C1C">否</text>
</svg>
