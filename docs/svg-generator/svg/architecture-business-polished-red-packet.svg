<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">抢红包系统业务架构示例</title><desc id="desc">抢红包系统场景、能力与业务对象架构，采用 polished 质感。</desc>
  <defs><filter id="shadow" x="-5%" y="-10%" width="110%" height="125%"><feDropShadow dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
  <rect width="1200" height="760" fill="#F5F7FB"/>
  <circle cx="1070" cy="86" r="62" fill="#2563EB" opacity="0.045"/>
  <text x="600" y="44" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#172033">抢红包系统业务架构图</text>
  <rect x="1036" y="22" width="124" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE"/><text x="1098" y="42" text-anchor="middle" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1D4ED8">POLISHED</text>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect x="40" y="76" width="1120" height="170" rx="14" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="68" y="112" font-size="18" font-weight="700" fill="#2563EB">业务场景层</text>
    <g fill="#EEF3F8" stroke="#D8E1EA"><rect x="68" y="136" width="250" height="76" rx="10"/><rect x="350" y="136" width="250" height="76" rx="10"/><rect x="632" y="136" width="250" height="76" rx="10"/><rect x="914" y="136" width="218" height="76" rx="10"/></g>
    <g font-size="15" font-weight="600" fill="#172033" text-anchor="middle"><text x="193" y="180">用户抢红包</text><text x="475" y="180">运营发红包</text><text x="757" y="180">平台活动管理</text><text x="1023" y="180">风控与增长</text></g>
    <rect x="40" y="278" width="1120" height="240" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="68" y="314" font-size="18" font-weight="700" fill="#2563EB">业务能力层</text>
    <g fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1.5"><rect x="68" y="340" width="244" height="144" rx="10"/><rect x="340" y="340" width="244" height="144" rx="10"/><rect x="612" y="340" width="244" height="144" rx="10"/><rect x="884" y="340" width="248" height="144" rx="10"/></g>
    <g font-size="15" font-weight="600" fill="#172033" text-anchor="middle"><text x="190" y="372">用户与账户域</text><text x="462" y="372">红包活动域</text><text x="734" y="372">领取交易域</text><text x="1008" y="372">运营风控域</text></g>
    <g font-size="12" fill="#475569" text-anchor="middle"><text x="190" y="414">注册 · 登录 · 实名 · 账户</text><text x="190" y="444">设备 · 黑名单 · 通知 · 留存</text><text x="462" y="414">活动 · 红包 · 预算 · 规则</text><text x="462" y="444">创建 · 发布 · 暂停 · 结束</text><text x="734" y="414">资格 · 抢夺 · 领取 · 入账</text><text x="734" y="444">幂等 · 限流 · 补偿 · 对账</text><text x="1008" y="414">渠道 · 运营 · 客服 · 触达</text><text x="1008" y="444">监控 · 风控 · 审计 · 分析</text></g>
    <rect x="40" y="550" width="1120" height="150" rx="14" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="68" y="586" font-size="18" font-weight="700" fill="#2563EB">业务对象与资源层</text>
    <g fill="#EEF3F8" stroke="#D8E1EA"><rect x="68" y="614" width="200" height="54" rx="10"/><rect x="290" y="614" width="200" height="54" rx="10"/><rect x="512" y="614" width="200" height="54" rx="10"/><rect x="734" y="614" width="200" height="54" rx="10"/><rect x="956" y="614" width="176" height="54" rx="10"/></g>
    <g font-size="14" fill="#172033" text-anchor="middle"><text x="168" y="647">用户</text><text x="390" y="647">红包</text><text x="612" y="647">活动</text><text x="834" y="647">领取记录</text><text x="1044" y="647">资金与规则</text></g>
