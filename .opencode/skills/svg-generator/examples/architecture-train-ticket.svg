<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">火车票系统部署架构示例</title><desc id="desc">火车票系统区域、订票服务集群和数据子网部署架构</desc><rect width="1200" height="760" fill="#F6F8FB"/>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#172033">火车票系统部署架构图</text>
    <rect x="40" y="80" width="1120" height="620" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="68" y="118" font-size="18" font-weight="700" fill="#2563EB">Region / 可用区域</text>
    <rect x="68" y="142" width="1064" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="94" y="178" font-size="15" font-weight="600" fill="#475569">VPC / 私有网络</text>
    <rect x="94" y="204" width="650" height="416" rx="12" fill="#FFFFFF" stroke="#D8E1EA"/><text x="120" y="238" font-size="15" font-weight="600" fill="#172033">计算子网</text>
    <rect x="120" y="264" width="598" height="318" rx="12" fill="#EEF3F8" stroke="#2563EB"/><text x="146" y="298" font-size="15" font-weight="600" fill="#2563EB">订票服务集群</text>
    <g fill="#FFFFFF" stroke="#D8E1EA"><rect x="146" y="328" width="164" height="96" rx="10"/><rect x="336" y="328" width="164" height="96" rx="10"/><rect x="526" y="328" width="164" height="96" rx="10"/><rect x="146" y="456" width="544" height="82" rx="10"/></g>
    <g font-size="14" fill="#172033" text-anchor="middle"><text x="228" y="382">查询节点</text><text x="418" y="382">订单节点</text><text x="608" y="382">支付节点</text><text x="418" y="505">负载均衡与服务入口</text></g>
    <rect x="776" y="204" width="330" height="416" rx="12" fill="#FFFFFF" stroke="#D8E1EA"/><text x="802" y="238" font-size="15" font-weight="600" fill="#172033">数据子网</text>
    <g fill="#ECFEFF" stroke="#A5F3FC"><rect x="802" y="264" width="278" height="82" rx="10"/><rect x="802" y="374" width="278" height="82" rx="10"/><rect x="802" y="484" width="278" height="82" rx="10"/></g>
    <g font-size="14" fill="#172033" text-anchor="middle"><text x="941" y="312">订单数据库集群</text><text x="941" y="422">余票缓存与事件总线</text><text x="941" y="532">审计备份与票据归档</text></g>
  </g>
</svg>
