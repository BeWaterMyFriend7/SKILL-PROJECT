<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" data-theme="steady-red-blue" data-mode="light">
  <title id="title">订单状态流转图</title>
  <desc id="desc">订单从创建、支付、发货到完成，以及取消异常分支的状态转换。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748B" />
    </marker>
    <marker id="error-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#EF4444" />
    </marker>
  </defs>
  <rect width="1120" height="680" fill="#F6F7FB" />
  <text x="48" y="58" font-size="28" font-weight="700" fill="#243B63">订单状态流转图</text>
  <text x="48" y="84" font-size="13" fill="#64748B">主状态沿单一轴线推进，取消状态使用独立异常通道</text>
  <rect x="48" y="122" width="1024" height="480" rx="18" fill="#FFFFFF" stroke="#CAD3DF" />
  <g fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="150" y1="270" x2="230" y2="270" />
    <line x1="400" y1="270" x2="470" y2="270" />
    <line x1="640" y1="270" x2="710" y2="270" />
    <line x1="880" y1="270" x2="950" y2="270" />
  </g>
  <circle id="state-start" cx="128" cy="270" r="12" fill="#C62828" />
  <g fill="#FFFFFF" stroke="#E7A5A5" stroke-width="2">
    <rect id="state-created" data-role="node" x="230" y="224" width="170" height="92" rx="14" />
    <rect id="state-paid" data-role="node" x="470" y="224" width="170" height="92" rx="14" />
    <rect id="state-shipped" data-role="node" x="710" y="224" width="170" height="92" rx="14" />
  </g>
  <rect id="state-completed" data-role="node" x="950" y="236" width="92" height="68" rx="34" fill="#ECFDF5" stroke="#22C55E" stroke-width="2" />
  <g text-anchor="middle">
    <text x="315" y="265" font-size="15" font-weight="600" fill="#243B63">待支付</text>
    <text x="315" y="289" font-size="12" fill="#64748B">订单已创建</text>
    <text x="555" y="265" font-size="15" font-weight="600" fill="#243B63">待发货</text>
    <text x="555" y="289" font-size="12" fill="#64748B">支付已确认</text>
    <text x="795" y="265" font-size="15" font-weight="600" fill="#243B63">待收货</text>
    <text x="795" y="289" font-size="12" fill="#64748B">物流已发出</text>
    <text x="996" y="276" font-size="14" font-weight="600" fill="#22C55E">已完成</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="435" y="254">支付成功</text>
    <text x="675" y="254">确认发货</text>
    <text x="915" y="254">确认收货</text>
  </g>
  <path d="M315 316V448H710" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#error-arrow)" />
  <path d="M555 316V448" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#error-arrow)" />
  <rect id="state-cancelled" data-role="node" x="710" y="408" width="170" height="80" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" />
  <text x="795" y="444" font-size="15" font-weight="600" fill="#EF4444" text-anchor="middle">已取消</text>
  <text x="795" y="468" font-size="12" fill="#64748B" text-anchor="middle">超时或用户取消</text>
  <text x="438" y="438" font-size="12" fill="#EF4444">取消 / 超时</text>
</svg>