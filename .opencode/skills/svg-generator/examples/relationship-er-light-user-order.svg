<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" data-theme="focused" data-mode="light">
  <title id="title">用户订单 ER 图模板</title>
  <desc id="desc">六个实体采用两行均匀网格，关系线使用实体之间的正交通道。</desc>
  <defs>
    <marker id="er-end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#64748B" />
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#F6F8FB" />
  <text x="44" y="50" font-size="26" font-weight="700" fill="#172033">用户订单 ER 图</text>
  <text x="44" y="76" font-size="12" fill="#64748B">实体均匀分布 · 字段按行对齐 · 基数绑定关系端点</text>
  <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#er-end)">
    <path id="er1" data-role="edge" d="M316 220H390" />
    <path id="er2" data-role="edge" d="M710 220H784" />
    <path id="er3" data-role="edge" d="M230 312V390" />
    <path id="er4" data-role="edge" d="M550 312V390" />
    <path id="er5" data-role="edge" d="M870 312V390" />
  </g>
  <g fill="#FFFFFF" stroke="#A1BBEE" stroke-width="2">
    <rect id="entity-user" data-role="node" x="70" y="126" width="246" height="186" rx="12" />
    <rect id="entity-order" data-role="node" x="390" y="126" width="320" height="186" rx="12" />
    <rect id="entity-item" data-role="node" x="784" y="126" width="246" height="186" rx="12" />
    <rect id="entity-address" data-role="node" x="70" y="390" width="246" height="186" rx="12" />
    <rect id="entity-payment" data-role="node" x="390" y="390" width="320" height="186" rx="12" />
    <rect id="entity-product" data-role="node" x="784" y="390" width="246" height="186" rx="12" />
  </g>
  <g fill="#E4EBFA">
    <rect x="70" y="126" width="246" height="40" rx="12" />
    <rect x="390" y="126" width="320" height="40" rx="12" />
    <rect x="784" y="126" width="246" height="40" rx="12" />
    <rect x="70" y="390" width="246" height="40" rx="12" />
    <rect x="390" y="390" width="320" height="40" rx="12" />
    <rect x="784" y="390" width="246" height="40" rx="12" />
  </g>
  <g fill="#172033" font-size="15" font-weight="700" text-anchor="middle">
    <text x="193" y="152">用户 User</text>
    <text x="550" y="152">订单 Order</text>
    <text x="907" y="152">订单项 OrderItem</text>
    <text x="193" y="416">地址 Address</text>
    <text x="550" y="416">支付 Payment</text>
    <text x="907" y="416">商品 Product</text>
  </g>
  <g fill="#475569" font-size="12">
    <text x="92" y="194">PK  user_id</text>
    <text x="92" y="222">username</text>
    <text x="92" y="250">mobile</text>
    <text x="92" y="278">status</text>
    <text x="412" y="194">PK  order_id</text>
    <text x="412" y="222">FK  user_id</text>
    <text x="412" y="250">FK  address_id</text>
    <text x="412" y="278">amount / status</text>
    <text x="806" y="194">PK  item_id</text>
    <text x="806" y="222">FK  order_id</text>
    <text x="806" y="250">FK  product_id</text>
    <text x="806" y="278">quantity / price</text>
    <text x="92" y="458">PK  address_id</text>
    <text x="92" y="486">FK  user_id</text>
    <text x="92" y="514">receiver</text>
    <text x="92" y="542">detail</text>
    <text x="412" y="458">PK  payment_id</text>
    <text x="412" y="486">FK  order_id</text>
    <text x="412" y="514">channel / amount</text>
    <text x="412" y="542">paid_at / status</text>
    <text x="806" y="458">PK  product_id</text>
    <text x="806" y="486">name / price</text>
    <text x="806" y="514">stock</text>
    <text x="806" y="542">status</text>
