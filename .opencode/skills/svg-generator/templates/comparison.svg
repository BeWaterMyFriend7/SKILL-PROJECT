<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
  <title id="title">方案对比图</title><desc id="desc">使用统一维度对齐比较两个候选方案。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
  <rect width="1100" height="680" fill="#F6F8FB"/><text x="48" y="58" font-size="28" font-weight="700" fill="#172033">方案对比</text><text x="48" y="84" font-size="13" fill="#64748B">以相同维度呈现差异、优势与适用场景</text>
  <rect x="48" y="118" width="1004" height="500" rx="18" fill="#FFFFFF" stroke="#D8E1EA" filter="url(#shadow)"/>
  <rect id="option-a" data-role="node" x="248" y="146" width="360" height="76" rx="12" fill="#E6EDFB" stroke="#A7C0F2"/><rect id="option-b" data-role="node" x="630" y="146" width="360" height="76" rx="12" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="428" y="180" font-size="18" font-weight="700" text-anchor="middle" fill="#2656B8">方案 A</text><text x="428" y="202" font-size="12" text-anchor="middle" fill="#64748B">稳定、标准化、易维护</text><text x="810" y="180" font-size="18" font-weight="700" text-anchor="middle" fill="#15803D">方案 B</text><text x="810" y="202" font-size="12" text-anchor="middle" fill="#64748B">灵活、快速、扩展性强</text>
  <g font-size="14" font-weight="600" fill="#475569"><text x="82" y="278">实施成本</text><text x="82" y="354">交付速度</text><text x="82" y="430">维护难度</text><text x="82" y="506">适用场景</text></g>
  <g fill="#F8FAFC" stroke="#E2E8F0"><rect x="248" y="246" width="360" height="52" rx="9"/><rect x="630" y="246" width="360" height="52" rx="9"/><rect x="248" y="322" width="360" height="52" rx="9"/><rect x="630" y="322" width="360" height="52" rx="9"/><rect x="248" y="398" width="360" height="52" rx="9"/><rect x="630" y="398" width="360" height="52" rx="9"/><rect x="248" y="474" width="360" height="86" rx="9"/><rect x="630" y="474" width="360" height="86" rx="9"/></g>
  <g font-size="13" fill="#334155" text-anchor="middle"><text x="428" y="278">中等，依赖标准组件</text><text x="810" y="278">较低，可渐进投入</text><text x="428" y="354">计划明确，节奏稳定</text><text x="810" y="354">原型和迭代速度快</text><text x="428" y="430">规则统一，维护简单</text><text x="810" y="430">需要更强工程治理</text><text x="428" y="508"><tspan x="428">长期稳定、多人协作</tspan><tspan x="428" dy="22">强调一致性的系统</tspan></text><text x="810" y="508"><tspan x="810">需求变化快、早期探索</tspan><tspan x="810" dy="22">强调快速反馈的系统</tspan></text></g>
</svg>
