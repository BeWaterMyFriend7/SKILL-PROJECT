<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
  <title id="title">技术选型决策矩阵</title><desc id="desc">按能力、成本、成熟度和扩展性评价三个候选方案。</desc>
  <rect width="1100" height="700" fill="#F5F7FB"/><text x="48" y="58" font-size="28" font-weight="700" fill="#172033">技术选型决策矩阵</text><text x="48" y="84" font-size="13" fill="#64748B">统一评价维度，清晰呈现评分和推荐结论</text>
  <rect x="48" y="122" width="1004" height="506" rx="18" fill="#FFFFFF" stroke="#D7E0EA"/>
  <rect x="72" y="148" width="956" height="64" rx="10" fill="#172033"/>
  <g fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle"><text x="174" y="187">候选方案</text><text x="374" y="187">能力匹配 35%</text><text x="574" y="187">成本 20%</text><text x="754" y="187">成熟度 25%</text><text x="930" y="187">扩展性 20%</text></g>
  <g stroke="#E2E8F0"><rect id="matrix-a" data-role="node" x="72" y="230" width="956" height="88" rx="10" fill="#EFF6FF"/><rect id="matrix-b" data-role="node" x="72" y="336" width="956" height="88" rx="10" fill="#F8FAFC"/><rect id="matrix-c" data-role="node" x="72" y="442" width="956" height="88" rx="10" fill="#F8FAFC"/></g>
  <g font-size="14" fill="#334155" text-anchor="middle"><text x="174" y="278" font-weight="700" fill="#1D4ED8">方案 A · 推荐</text><text x="374" y="278">9.2</text><text x="574" y="278">8.0</text><text x="754" y="278">9.0</text><text x="930" y="278">8.8</text><text x="174" y="384" font-weight="600">方案 B</text><text x="374" y="384">8.4</text><text x="574" y="384">8.8</text><text x="754" y="384">7.6</text><text x="930" y="384">8.2</text><text x="174" y="490" font-weight="600">方案 C</text><text x="374" y="490">7.8</text><text x="574" y="490">9.1</text><text x="754" y="490">8.1</text><text x="930" y="490">7.4</text></g>
  <rect x="72" y="552" width="956" height="52" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/><text x="96" y="584" font-size="14" font-weight="600" fill="#047857">推荐结论：方案 A 综合得分最高，能力匹配和成熟度优势明显</text>
