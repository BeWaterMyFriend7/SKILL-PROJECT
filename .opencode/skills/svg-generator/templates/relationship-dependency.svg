<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
  <title id="title">服务依赖关系</title><desc id="desc">入口、核心服务、基础服务与数据资源的分层依赖关系。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748B"/></marker></defs>
  <rect width="1100" height="700" fill="#F4F7FC"/><text x="48" y="58" font-size="28" font-weight="700" fill="#1F2937">服务依赖关系</text><text x="48" y="84" font-size="13" fill="#64748B">按层级收敛依赖方向，减少跨层长连线</text>
  <g fill="#64748B" font-size="14" font-weight="600"><text x="54" y="178">入口层</text><text x="54" y="322">核心层</text><text x="54" y="466">基础层</text><text x="54" y="610">资源层</text></g>
  <g fill="#FFFFFF" stroke="#C9D7EA"><rect id="dep-gateway" data-role="node" x="260" y="130" width="580" height="70" rx="12"/><rect id="dep-order" data-role="node" x="190" y="274" width="220" height="70" rx="12"/><rect id="dep-payment" data-role="node" x="440" y="274" width="220" height="70" rx="12"/><rect id="dep-inventory" data-role="node" x="690" y="274" width="220" height="70" rx="12"/><rect id="dep-user" data-role="node" x="190" y="418" width="220" height="70" rx="12"/><rect id="dep-message" data-role="node" x="440" y="418" width="220" height="70" rx="12"/><rect id="dep-config" data-role="node" x="690" y="418" width="220" height="70" rx="12"/><rect id="dep-db" data-role="node" x="315" y="562" width="220" height="70" rx="12"/><rect id="dep-cache" data-role="node" x="565" y="562" width="220" height="70" rx="12"/></g>
  <g fill="#1F2937" font-size="14" font-weight="600" text-anchor="middle"><text x="550" y="172">统一网关</text><text x="300" y="316">订单服务</text><text x="550" y="316">支付服务</text><text x="800" y="316">库存服务</text><text x="300" y="460">用户服务</text><text x="550" y="460">消息服务</text><text x="800" y="460">配置中心</text><text x="425" y="604">关系数据库</text><text x="675" y="604">缓存集群</text></g>
  <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"><path d="M550 200V238H300V274"/><path d="M550 200V274"/><path d="M550 200V238H800V274"/><path d="M300 344V418"/><path d="M550 344V418"/><path d="M800 344V418"/><path d="M300 488V526H425V562"/><path d="M550 488V526H675V562"/></g>
</svg>
