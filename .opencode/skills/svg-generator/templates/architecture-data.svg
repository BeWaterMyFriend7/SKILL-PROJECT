  </g>
  <line id="main-data-flow" data-role="edge" x1="1054" y1="800" x2="1054" y2="184" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1034" y="500" font-size="12" fill="#2563EB" text-anchor="middle" transform="rotate(-90 1034 500)">聚合主数据流</text>
  <g>
    <rect x="1110" y="160" width="214" height="200" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/><rect x="1110" y="382" width="214" height="200" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/><rect x="1110" y="604" width="214" height="234" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="1134" y="194" font-size="16" font-weight="700" fill="#1D4ED8">数据治理</text><text x="1134" y="416" font-size="16" font-weight="700" fill="#15803D">数据安全</text><text x="1134" y="638" font-size="16" font-weight="700" fill="#C2410C">平台运维</text>
    <g font-size="13" fill="#475569"><text x="1134" y="228">数据标准 · 元数据</text><text x="1134" y="258">血缘 · 质量 · 目录</text><text x="1134" y="288">生命周期管理</text><text x="1134" y="450">认证鉴权 · 分级分类</text><text x="1134" y="480">脱敏 · 审计</text><text x="1134" y="510">行列权限</text><text x="1134" y="672">任务调度 · 监控告警</text><text x="1134" y="702">失败重试 · 数据补偿</text><text x="1134" y="732">容量管理</text></g>
