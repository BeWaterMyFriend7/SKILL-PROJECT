    <rect x="72" y="400" width="1010" height="78" rx="12"/><rect x="72" y="520" width="1010" height="78" rx="12"/>
    <rect x="72" y="640" width="1010" height="78" rx="12"/><rect x="72" y="760" width="1010" height="78" rx="12"/>
  </g>
