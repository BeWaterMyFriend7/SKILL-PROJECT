<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc" font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
  <title id="title">数据平台数据架构</title>
  <desc id="desc">从数据源到数据应用的六层数据架构，以及数据治理、安全和平台运维横切能力。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563EB"/></marker>
  </defs>
  <rect width="1400" height="960" fill="#F5F7FB"/>
  <text x="48" y="54" font-size="28" font-weight="700" fill="#172033">数据平台数据架构</text>
  <text x="48" y="80" font-size="13" fill="#64748B">分层组织数据采集、加工、建模、服务与应用，横切能力贯穿全链路</text>
  <rect x="48" y="104" width="1304" height="808" rx="18" fill="#FFFFFF" stroke="#D7E0EA" filter="url(#shadow)"/>
  <g fill="#172033" font-size="16" font-weight="700">
    <text x="76" y="148">数据应用层</text><text x="76" y="268">数据服务层</text><text x="76" y="388">存储与模型层</text>
    <text x="76" y="508">计算加工层</text><text x="76" y="628">数据接入层</text><text x="76" y="748">数据源层</text>
  </g>
